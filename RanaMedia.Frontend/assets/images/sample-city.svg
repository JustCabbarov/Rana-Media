<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="skyCity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071d12"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#86cfa3"/>
    </linearGradient>
    <linearGradient id="sunSweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef6f0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1b6e3f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#skyCity)"/>
  <!-- Architectural diagonal shaft of light -->
  <polygon points="0,0 640,0 1320,900 320,900" fill="url(#sunSweep)"/>
  <!-- Horizon & plaza -->
  <rect y="650" width="1600" height="250" fill="#06170e"/>
  <line x1="0" y1="650" x2="1600" y2="650" stroke="#c2ebd0" stroke-opacity="0.4" stroke-width="1.5"/>
  <!-- Classical colonnade pillars -->
  <g fill="#0e3b21" opacity="0.9">
    <rect x="140" y="130" width="90" height="520"/>
    <rect x="330" y="170" width="76" height="480"/>
    <rect x="490" y="210" width="64" height="440"/>
    <rect x="625" y="245" width="54" height="405"/>
    <rect x="740" y="275" width="44" height="375"/>
    <rect x="835" y="300" width="36" height="350"/>
  </g>
  <!-- Distant equestrian silhouette / steppe monument -->
  <g transform="translate(1050, 495)" fill="#eef6f0" opacity="0.88">
    <ellipse cx="110" cy="88" rx="68" ry="26"/>
    <path d="M148,74 L175,28 L196,35 L182,78 Z"/>
    <path d="M52,96 L36,155 L48,155 L64,102 Z"/>
    <path d="M84,106 L82,155 L94,155 L96,106 Z"/>
    <path d="M136,106 L146,155 L158,155 L148,102 Z"/>
    <path d="M158,98 L184,155 L196,155 L168,94 Z"/>
    <circle cx="116" cy="40" r="14"/>
    <path d="M102,54 L132,54 L126,90 L98,90 Z"/>
  </g>
  <!-- Fine grid lines on plaza -->
  <g stroke="#c2ebd0" stroke-opacity="0.18" stroke-width="1.2">
    <line x1="880" y1="650" x2="140" y2="900"/>
    <line x1="940" y1="650" x2="540" y2="900"/>
    <line x1="1000" y1="650" x2="960" y2="900"/>
    <line x1="1060" y1="650" x2="1380" y2="900"/>
  </g>
</svg>
