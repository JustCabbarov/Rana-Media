<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgMind" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b261c"/>
      <stop offset="55%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#82c4a6"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6f0"/>
      <stop offset="100%" stop-color="#cdebd9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bgMind)"/>
  <!-- Perspective floor & shadow geometry -->
  <polygon points="0,700 1600,700 1600,900 0,900" fill="#081c14"/>
  <polygon points="620,700 980,700 1320,900 280,900" fill="#1b4d38" opacity="0.6"/>
  <!-- Nested surrealist arches -->
  <path d="M560,700 L560,360 A240,240 0 0 1 1040,360 L1040,700 Z" fill="#164230"/>
  <path d="M620,700 L620,380 A180,180 0 0 1 980,380 L980,700 Z" fill="url(#archGrad)" opacity="0.92"/>
  <path d="M685,700 L685,405 A115,115 0 0 1 915,405 L915,700 Z" fill="#c6ebd9"/>
  <!-- Ascending steps into inner light -->
  <g fill="#0d2b1f">
    <rect x="695" y="660" width="210" height="40"/>
    <rect x="715" y="622" width="170" height="38" opacity="0.88"/>
    <rect x="735" y="586" width="130" height="36" opacity="0.76"/>
    <rect x="752" y="552" width="96" height="34" opacity="0.64"/>
    <rect x="768" y="520" width="64" height="32" opacity="0.5"/>
  </g>
  <!-- Mirror reflection lines & spheres -->
  <circle cx="800" cy="340" r="34" fill="#2d6a4f" opacity="0.85"/>
  <circle cx="330" cy="320" r="140" fill="none" stroke="#c6ebd9" stroke-opacity="0.26" stroke-width="1.5"/>
  <circle cx="1270" cy="320" r="140" fill="none" stroke="#c6ebd9" stroke-opacity="0.26" stroke-width="1.5"/>
  <line x1="180" y1="700" x2="1420" y2="700" stroke="#c6ebd9" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
